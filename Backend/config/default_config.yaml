# =============================================================================
# AuraNet — default_config.yaml
# Central configuration: sensor calibration, physics constants, model
# hyperparameters, and decision thresholds. Every module reads from this file
# so a mission/sensor swap only requires editing values here.
# =============================================================================

project:
  name: "AuraNet"
  description: >
    AI-assisted image-enhancement pipeline for planetary exploration imagery.
    Improves visibility under low illumination, noise, and limited dynamic
    range while minimizing hallucinated structure and preserving scientific
    (radiometric) fidelity.
  seed: 42
  device: "cuda"          # "cuda" | "cpu" — pipeline falls back to cpu if unavailable

# -----------------------------------------------------------------------------
# I/O
# -----------------------------------------------------------------------------
paths:
  raw_dir: "data/raw"
  output_dir: "data/output"
  checkpoint_dir: "checkpoints"
  log_dir: "logs"

io:
  input_bit_depth: 16          # native sensor bit depth (PDS4 / GeoTIFF)
  input_dtype: "uint16"
  working_dtype: "float32"
  nodata_value: 0              # value treated as sensor-invalid / off-frame

# -----------------------------------------------------------------------------
# Sensor / radiometric calibration (physics_frontend.py)
# Placeholder gains — replace with mission-specific calibration file values.
# -----------------------------------------------------------------------------
calibration:
  dark_frame_path: null        # optional path to a dark-current frame
  flat_field_path: null        # optional path to a flat-field frame
  gain_e_per_dn: 2.3           # electrons per digital number (camera gain)
  read_noise_e: 4.5            # electron RMS read noise
  bias_offset_dn: 128          # sensor bias/offset in DN
  black_level_dn: 64
  saturation_dn: 65000

# -----------------------------------------------------------------------------
# Cosmic ray scrubber (physics_frontend.py)
# -----------------------------------------------------------------------------
cosmic_ray:
  enabled: true
  method: "sigma_clip_median"  # "sigma_clip_median" | "laplacian"
  window_size: 5
  sigma_threshold: 6.0
  max_hit_fraction: 0.02       # sanity cap: abort scrub if >2% flagged (likely miscalibration)

# -----------------------------------------------------------------------------
# Anscombe variance-stabilizing transform (physics_frontend.py)
# -----------------------------------------------------------------------------
anscombe:
  apply: true
  # x' = 2 * sqrt(x + 3/8)  (Poisson-Gaussian approximation)
  epsilon: 0.375

# -----------------------------------------------------------------------------
# Wavelet decomposition + implicit de-quantization (wavelet_dequant.py)
# -----------------------------------------------------------------------------
wavelet:
  family: "sym4"                # SWT wavelet family
  levels: 2                     # decomposition depth
  dequant:
    enabled: true
    hidden_channels: 16
    num_layers: 3
    quantization_step: 1.0      # ~1 DN step of original quantizer

# -----------------------------------------------------------------------------
# Zero-DCE illumination curve estimator — operates on LL (approximation) band
# -----------------------------------------------------------------------------
zero_dce:
  num_iterations: 8             # LE curve applications (paper default)
  num_filters: 32
  num_conv_layers: 7
  loss_weights:
    spatial_consistency: 1.0
    exposure_control: 10.0
    illumination_smoothness: 200.0
    color_constancy: 5.0         # ignored for single-channel planetary bands
  target_exposure: 0.6           # well-exposed grayscale target (0-1)

# -----------------------------------------------------------------------------
# NAFNet detail restorer — operates on LH / HL / HH detail bands
# -----------------------------------------------------------------------------
nafnet:
  width: 32
  enc_blocks: [1, 1, 2]
  middle_blocks: 2
  dec_blocks: [1, 1, 1]
  dw_expand: 2
  ffn_expand: 2

# -----------------------------------------------------------------------------
# Bayesian heteroscedastic uncertainty head
# -----------------------------------------------------------------------------
uncertainty:
  hidden_channels: 24
  min_log_var: -6.0
  max_log_var: 4.0
  trust_map:
    # trust = exp(-log_var), min-max normalized per-scene to [0, 1]
    low_trust_threshold: 0.35    # below this, pixel flagged "low scientific confidence"
    hallucination_flag_threshold: 0.20

# -----------------------------------------------------------------------------
# Evaluation thresholds (evaluation/metrics.py)
# -----------------------------------------------------------------------------
evaluation:
  metrics: ["psnr", "ssim", "niqe", "brisque", "entropy_gain"]
  min_acceptable_ssim_vs_raw_structure: 0.85   # structure-preservation guardrail
  report_format: "json"                        # "json" | "csv"

# -----------------------------------------------------------------------------
# Export (evaluation/exporter.py)
# -----------------------------------------------------------------------------
export:
  output_dtype: "uint16"
  compress: "deflate"
  preserve_crs: true
  write_trust_band: true          # append trust map as extra GeoTIFF band
  write_trust_sidecar: true       # also write standalone *_trust.tif
